    <!--
      The React app has its own in-app /contact route. We replaced it with the
      combined Contact + Quote page (contact.html). Because the SPA router
      hijacks clicks on /contact links (ignoring their href), we (1) redirect any
      direct hit on /contact and (2) intercept contact clicks in the capture
      phase — before React's router runs — and do a real navigation instead.
    -->
    <script>
      (function () {
        if (location.pathname === "/contact") {
          location.replace("/contact.html");
        }
        document.addEventListener(
          "click",
          function (e) {
            var a = e.target && e.target.closest ? e.target.closest("a") : null;
            if (!a) return;
            var href = a.getAttribute("href") || "";
            if (href === "/contact" || href === "/contact.html") {
              e.preventDefault();
              e.stopImmediatePropagation();
              window.location.assign("/contact.html");
            }
          },
          true
        );
      })();
    </script>

    <!-- Remove the hero video's poster so only the video shows (no image flash) -->
    <script>
      (function () {
        function strip() {
          document.querySelectorAll("video[poster]").forEach(function (v) {
            v.removeAttribute("poster");
          });
        }
        strip();
        var mo = new MutationObserver(strip);
        mo.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["poster"],
        });
        document.addEventListener("DOMContentLoaded", strip);
      })();
    </script>

    <!-- Scroll to top when navigating to a different page (route change) -->
    <script>
      (function () {
        var lastPath = location.pathname;
        function toTop() {
          window.scrollTo(0, 0);
        }
        function onNav() {
          if (location.pathname !== lastPath) {
            lastPath = location.pathname;
            toTop();
            requestAnimationFrame(toTop);
            setTimeout(toTop, 60);
            setTimeout(toTop, 150);
          }
        }
        ["pushState", "replaceState"].forEach(function (m) {
          var orig = history[m];
          history[m] = function () {
            var r = orig.apply(this, arguments);
            onNav();
            return r;
          };
        });
        window.addEventListener("popstate", onNav);
      })();
    </script>

    <!-- Add a symmetric "Gallery" link into the nav (after Contact) -->
    <script>
      (function () {
        function addGallery() {
          // Remove the old standalone "Get a Quote" link (now merged into Contact)
          document.querySelectorAll('a[data-quote="1"]').forEach(function (q) {
            q.remove();
          });
          // Remove any stray Gallery links that landed outside the header nav
          document.querySelectorAll('a[data-gallery="1"]').forEach(function (g) {
            if (!g.closest("header")) g.remove();
          });
          // Route EVERY link to the old React /contact route (nav, service-card
          // CTAs, footer, etc.) to the combined Contact + Quote page.
          document.querySelectorAll('a[href="/contact"]').forEach(function (a) {
            a.setAttribute("href", "/contact.html");
          });
          // Inject a Gallery link beside the Contact link inside the header nav
          document.querySelectorAll('header a[href="/contact.html"]').forEach(function (contact) {
            var sib = contact.nextElementSibling;
            if (sib && sib.getAttribute("data-gallery") === "1") return;
            var g = document.createElement("a");
            g.href = "/gallery.html";
            g.textContent = "Gallery";
            g.className = contact.className;
            g.setAttribute("data-gallery", "1");
            contact.insertAdjacentElement("afterend", g);
          });
        }
        addGallery();
        new MutationObserver(addGallery).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
        document.addEventListener("DOMContentLoaded", addGallery);
      })();
    </script>
